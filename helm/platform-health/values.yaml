replicaCount: 2

image:
  repository: docker.io/library/platform-health
  tag: "1.0.0"
  pullPolicy: Never

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

config:
  awxUrl: "http://awx-service.awx.svc.cluster.local"
  awxTimeout: "2.0"
  kubernetesTimeout: "2.0"
  kubernetesNamespace: "awx"

serviceAccount:
  create: true
  name: platform-health

rbac:
  create: true

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

livenessProbe:
  path: /health/live
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  path: /health/ready
  initialDelaySeconds: 3
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3
