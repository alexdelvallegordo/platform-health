apiVersion: v1
kind: Service
metadata:
  name: {{ include "platform-health.fullname" . }}
  labels:
    {{- include "platform-health.labels" . | nindent 4 }}

spec:
  type: {{ .Values.service.type }}

  selector:
    app.kubernetes.io/name: {{ include "platform-health.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}

  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
