apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "platform-health.fullname" . }}-config
  labels:
    {{- include "platform-health.labels" . | nindent 4 }}

data:
  AWX_URL: {{ .Values.config.awxUrl | quote }}
  AWX_TIMEOUT: {{ .Values.config.awxTimeout | quote }}
  KUBERNETES_TIMEOUT: {{ .Values.config.kubernetesTimeout | quote }}
  KUBERNETES_NAMESPACE: {{ .Values.config.kubernetesNamespace | quote }}
