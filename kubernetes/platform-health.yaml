apiVersion: v1
kind: Namespace
metadata:
  name: platform-health

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-health
  namespace: platform-health

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-health-config
  namespace: platform-health
data:
  AWX_URL: "http://awx-service.awx.svc.cluster.local"
  AWX_TIMEOUT: "2.0"
  KUBERNETES_TIMEOUT: "2.0"
  KUBERNETES_NAMESPACE: "awx"

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: platform-health-node-reader
rules:
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - get
      - list

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: platform-health-node-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: platform-health-node-reader
subjects:
  - kind: ServiceAccount
    name: platform-health
    namespace: platform-health

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-health-awx-reader
  namespace: awx
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
      - deployments/status
      - statefulsets
      - statefulsets/status
    verbs:
      - get

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-health-awx-reader
  namespace: awx
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platform-health-awx-reader
subjects:
  - kind: ServiceAccount
    name: platform-health
    namespace: platform-health

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-health
  namespace: platform-health
spec:
  replicas: 2

  selector:
    matchLabels:
      app: platform-health

  template:
    metadata:
      labels:
        app: platform-health

    spec:
      serviceAccountName: platform-health

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: platform-health
          image: platform-health:1.0.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          envFrom:
            - configMapRef:
                name: platform-health-config

          env:
            - name: TMPDIR
              value: /tmp

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi

          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: platform-health
  namespace: platform-health
spec:
  type: ClusterIP

  selector:
    app: platform-health

  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
