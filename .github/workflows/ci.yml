name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  tests:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile application
        run: |
          python -m compileall app

      - name: Run tests
        run: |
          pytest -q


  helm:
    name: Helm validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Lint Helm chart
        run: |
          helm lint helm/platform-health

      - name: Render Helm manifests
        run: |
          helm template \
            platform-health \
            helm/platform-health \
            --namespace platform-health \
            > /tmp/platform-health-rendered.yaml

      - name: Verify rendered manifests
        run: |
          test -s /tmp/platform-health-rendered.yaml
          grep -q "kind: Deployment" /tmp/platform-health-rendered.yaml
          grep -q "kind: Service" /tmp/platform-health-rendered.yaml


  container:
    name: Container build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: platform-health:ci
